language = "C++"
include_guard = "SOURCE2RUST_RUST_ABI_HPP"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
include_version = false
no_includes = true
sys_includes = ["cstdint"]
line_length = 140
style = "both"
tab_width = 4

header = """/**
 * Shared declarations for the Source2Rust native/Rust ABI.
 *
 * Generated automatically from source2rust_abi.
 */"""

[parse]
parse_deps = false

[export]
include = [
    "API_VERSION",
    "ABI_MAGIC",
    "LOG_INFO",
    "LOG_WARN",
    "LOG_ERROR",
    "S2RHostApi",
]

[fn]
rename_args = "None"
sort_by = "None"

[struct]
rename_fields = "None"
