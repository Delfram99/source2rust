language = "C++"
include_guard = "SOURCE2RUST_FFI_HPP"
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
includes = ["rust_abi.hpp"]
include_version = false
no_includes = true
sys_includes = ["cstdint"]
line_length = 140
style = "both"
tab_width = 4

header = """/**
 * C declarations for functions implemented in source2rust_core.
 *
 * Generated automatically during the Source2Rust build.
 */"""

[parse]
parse_deps = false

[export]
include = [
    "s2r_abi_fingerprint",
    "s2r_core_start",
    "s2r_core_stop",
]

[fn]
rename_args = "None"
sort_by = "None"

[struct]
rename_fields = "None"
