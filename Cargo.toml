[workspace]
members = [
    "crates/source2rust_abi",
    "crates/source2rust_core",
    "crates/source2rust_mm",
    "crates/source2rust_runtime",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.0.1"
authors = ["Delfram99"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Delfram99/source2rust"
publish = false

[workspace.dependencies]
cbindgen = { version = "0.29", default-features = false }
cc = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
source2rust_abi = { path = "crates/source2rust_abi" }
source2rust_core = { path = "crates/source2rust_core" }
source2rust_runtime = { path = "crates/source2rust_runtime" }

[profile.dev]
panic = "unwind"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
